name: Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # required for npm Trusted Publishing (OIDC) — no NPM_TOKEN needed

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Detect pre-release tag
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *"-alpha"* || "$TAG" == *"-beta"* || "$TAG" == *"-rc"* || "$TAG" == *"-next"* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Auth is handled via npm Trusted Publishing (OIDC): the id-token permission
      # above lets pnpm exchange a short-lived GitHub Actions OIDC token for a
      # publish token, so no NPM_TOKEN secret is needed. Requires the "Trusted
      # Publisher" to be configured for this package on npmjs.com (see CONTRIBUTING.md).
      - name: Publish packages (latest)
        if: steps.prerelease.outputs.tag == 'latest'
        run: pnpm changeset publish

      - name: Publish packages (pre-release)
        if: steps.prerelease.outputs.tag == 'next'
        run: pnpm changeset publish --tag next

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.tag == 'next' }}
